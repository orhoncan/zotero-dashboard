    <div x-show="connected && !loading && activeView==='items'" class="p-4" x-cloak>
      <div class="flex items-center justify-between gap-3 mb-3">
        <div class="flex items-center gap-2 flex-wrap">
          <template x-if="selectedCollection">
            <span class="tag-pill active flex items-center gap-1">
              <span x-text="getCollectionName(selectedCollection)"></span>
              <button @click="selectCollection(null)" class="hover:text-red-200 ml-0.5">&times;</button>
            </span>
          </template>
          <template x-if="selectedTag">
            <span class="tag-pill active flex items-center gap-1">
              <span x-text="selectedTag"></span>
              <button @click="toggleTag(selectedTag)" class="hover:text-red-200 ml-0.5">&times;</button>
            </span>
          </template>
          <template x-if="searchQuery">
            <span class="tag-pill active flex items-center gap-1">
              "<span x-text="searchQuery"></span>"
              <button @click="searchQuery=''; search()" class="hover:text-red-200 ml-0.5">&times;</button>
            </span>
          </template>
          <template x-if="selectedItemType !== 'all'">
            <span class="tag-pill active flex items-center gap-1">
              <span x-text="aiLanguage === 'en' ? 'Type:' : 'Tür:'"></span>
              <span x-text="formatItemType(selectedItemType)"></span>
              <button @click="selectedItemType='all'; currentPage=1" class="hover:text-red-200 ml-0.5">&times;</button>
            </span>
          </template>
          <template x-if="localFilterQuery">
            <span class="tag-pill active flex items-center gap-1">
              <span x-text="aiLanguage === 'en' ? 'Quick:' : 'Hızlı:'"></span>
              "<span x-text="localFilterQuery"></span>"
              <button @click="localFilterQuery=''; currentPage=1" class="hover:text-red-200 ml-0.5">&times;</button>
            </span>
          </template>
          <span class="text-xs text-slate-500" x-text="displayItems.length + ' ' + (aiLanguage === 'en' ? 'results' : 'sonuç')"></span>
        </div>
        <div class="flex items-center gap-2 shrink-0 flex-wrap justify-end">
          <input type="text" x-model="localFilterQuery" @input="currentPage=1"
            :placeholder="aiLanguage === 'en' ? 'Quick local filter' : 'Lokal hızlı filtre'"
            class="w-44 bg-slate-800 border border-slate-600 rounded-md text-xs px-2 py-1 text-slate-300 focus:outline-none focus:border-red-500 placeholder-slate-500">
          <select x-model="selectedItemType" @change="currentPage=1" class="bg-slate-800 border border-slate-600 rounded-md text-xs px-2 py-1 text-slate-300 focus:outline-none focus:border-red-500">
            <option value="all" x-text="aiLanguage === 'en' ? 'All Types' : 'Tüm Türler'"></option>
            <template x-for="type in itemTypeOptions" :key="type">
              <option :value="type" x-text="formatItemType(type)"></option>
            </template>
          </select>
          <select x-model="sortBy" @change="currentPage=1" class="bg-slate-800 border border-slate-600 rounded-md text-xs px-2 py-1 text-slate-300 focus:outline-none focus:border-red-500">
            <option value="dateAdded-desc" x-text="aiLanguage === 'en' ? 'Date Added (new)' : 'Eklenme (yeni)'"></option>
            <option value="dateAdded-asc" x-text="aiLanguage === 'en' ? 'Date Added (old)' : 'Eklenme (eski)'"></option>
            <option value="title-asc" x-text="aiLanguage === 'en' ? 'Title A-Z' : 'Başlık A-Z'"></option>
            <option value="title-desc" x-text="aiLanguage === 'en' ? 'Title Z-A' : 'Başlık Z-A'"></option>
            <option value="year-desc" x-text="aiLanguage === 'en' ? 'Year (new)' : 'Yıl (yeni)'"></option>
            <option value="year-asc" x-text="aiLanguage === 'en' ? 'Year (old)' : 'Yıl (eski)'"></option>
            <option value="author-asc" x-text="aiLanguage === 'en' ? 'Author A-Z' : 'Yazar A-Z'"></option>
          </select>
          <button @click="exportCsv()" :disabled="displayItems.length === 0"
            class="px-2.5 py-1 text-xs rounded-md border border-slate-600 bg-slate-800 hover:bg-slate-700 disabled:opacity-40 transition">CSV</button>
          <button @click="exportBibTeX()" :disabled="displayItems.length === 0"
            class="px-2.5 py-1 text-xs rounded-md border border-slate-600 bg-slate-800 hover:bg-slate-700 disabled:opacity-40 transition">BibTeX</button>
          <button @click="compareSelectedItems()"
            :disabled="selectedCompareKeys.length < 2 || selectedCompareKeys.length > 3 || chatLoading"
            class="px-2.5 py-1 text-xs rounded-md border border-red-500/30 bg-red-500/20 hover:bg-red-500/30 disabled:opacity-40 transition">
            <span x-text="aiLanguage === 'en' ? 'Compare' : 'Karşılaştır'"></span>
            (<span x-text="selectedCompareKeys.length"></span>)
          </button>
          <button x-show="selectedCompareKeys.length" @click="clearCompareSelection()"
            class="px-2 py-1 text-xs rounded-md border border-slate-600 bg-slate-800 hover:bg-slate-700 transition"
            x-text="aiLanguage === 'en' ? 'Clear' : 'Temizle'"></button>
        </div>
      </div>

      <!-- Empty -->
      <div x-show="displayItems.length === 0" class="flex flex-col items-center justify-center py-16 text-center">
        <svg class="w-16 h-16 text-slate-700 mb-3" fill="none" stroke="currentColor" stroke-width="1" viewBox="0 0 24 24"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        <p class="text-slate-400 text-sm" x-text="aiLanguage === 'en' ? 'No results found' : 'Sonuç bulunamadı'"></p>
        <button
          x-show="hasActiveItemFilters()"
          @click="clearAllFiltersAndReload()"
          class="mt-3 text-xs px-3 py-1.5 rounded-md border border-slate-600 bg-slate-800 hover:bg-slate-700 transition"
          x-text="aiLanguage === 'en' ? 'Reset filters' : 'Filtreleri sıfırla'"></button>
      </div>

      <!-- Items List -->
      <div class="space-y-1" x-show="displayItems.length > 0">
        <template x-for="item in paginatedItems" :key="item.key">
          <div @click="selectItem(item)" class="card card-hover cursor-pointer transition fade-in flex gap-3 relative overflow-hidden"
            :class="[
              listDensity === 'compact' ? 'px-2.5 py-2 items-center' : 'p-3',
              selectedItem?.key === item.key ? 'border-red-500/50 bg-slate-800/80' : '',
              isCompareSelected(item.key) ? 'ring-1 ring-emerald-500/50' : ''
            ]">
            <span x-show="selectedItem?.key === item.key" class="absolute left-0 top-0 h-full w-[3px] bg-red-500/80"></span>
            <label class="shrink-0" :class="listDensity === 'compact' ? 'mt-0' : 'mt-0.5'" @click.stop>
              <input type="checkbox" class="rounded bg-slate-800 border-slate-600 text-red-500 focus:ring-red-500"
                :checked="isCompareSelected(item.key)"
                @click.stop
                @change="toggleCompare(item, $event.target.checked)">
            </label>
            <div class="shrink-0 rounded-lg flex items-center justify-center text-xs font-bold"
              :class="[getTypeColor(item.data.itemType), listDensity === 'compact' ? 'w-7 h-7' : 'w-8 h-8']">
              <span class="inline-flex items-center justify-center" x-html="getTypeIcon(item.data.itemType)"></span>
            </div>
            <div class="flex-1 min-w-0">
              <h4 class="font-medium truncate" :class="listDensity === 'compact' ? 'text-[13px]' : 'text-sm'" x-text="item.data.title || (aiLanguage === 'en' ? 'Untitled' : 'Başlıksız')"></h4>
              <div class="flex items-center gap-2" :class="listDensity === 'compact' ? 'mt-0 text-[11px]' : 'mt-0.5'">
                <span class="truncate" :class="listDensity === 'compact' ? 'text-[11px] text-slate-400' : 'text-xs text-slate-400'" x-text="formatAuthors(item.data.creators)"></span>
                <span x-show="item.data.date" class="text-xs text-slate-500" x-text="extractYear(item.data.date)"></span>
                <span x-show="item.data.publicationTitle" class="text-xs text-slate-500 italic truncate" x-text="item.data.publicationTitle"></span>
              </div>
            </div>
            <!-- PDF actions -->
            <div x-show="item._hasPdf" class="shrink-0 flex items-center gap-0.5">
              <button
                @click.stop="openPdf(item)"
                class="p-1 rounded-md border border-red-500/30 bg-red-500/10 text-red-300 hover:text-red-200 hover:bg-red-500/20 transition"
                :title="aiLanguage === 'en' ? 'Open PDF in panel' : 'PDF\'yi panelde aç'"
                :aria-label="aiLanguage === 'en' ? 'Open PDF in panel' : 'PDF\'yi panelde aç'">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                  <path d="M14 2H7a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/>
                  <path d="M14 2v6h6"/>
                  <path d="M8.5 13h7M8.5 16h7M8.5 19h4.5"/>
                </svg>
              </button>
              <button
                @click.stop="openItemPdfInZoteroReader(item)"
                class="p-1 rounded-md border border-amber-500/30 bg-amber-500/10 text-amber-300 hover:text-amber-200 hover:bg-amber-500/20 transition"
                :title="aiLanguage === 'en' ? 'Open in Zotero Reader app' : 'Zotero Reader uygulamasında aç'"
                :aria-label="aiLanguage === 'en' ? 'Open in Zotero Reader app' : 'Zotero Reader uygulamasında aç'">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24">
                  <path d="M14 3h7v7"/>
                  <path d="M10 14 21 3"/>
                  <rect x="3" y="7" width="11" height="14" rx="2"/>
                </svg>
              </button>
            </div>
            <div class="flex items-center gap-1 shrink-0">
              <template x-for="tag in topicTags(item.data.tags).concat(systemTags(item.data.tags)).slice(0,2)" :key="tag.tag">
                <span :class="isSystemTag(tag.tag) ? 'text-[10px] bg-slate-800/50 border border-slate-600/60 text-slate-500 rounded px-1.5 py-0.5' : 'text-[10px] bg-slate-700 text-slate-300 rounded px-1.5 py-0.5'" x-text="tag.tag"></span>
              </template>
            </div>
          </div>
        </template>
      </div>

      <!-- Pagination -->
      <div class="flex items-center justify-center gap-2 mt-4" x-show="totalPages > 1">
        <button @click="currentPage = Math.max(1, currentPage-1)" :disabled="currentPage===1"
          class="px-3 py-1.5 text-xs bg-slate-800 rounded-lg hover:bg-slate-700 disabled:opacity-30 transition">&laquo;</button>
        <span class="text-xs text-slate-400" x-text="currentPage + ' / ' + totalPages"></span>
        <button @click="currentPage = Math.min(totalPages, currentPage+1)" :disabled="currentPage===totalPages"
          class="px-3 py-1.5 text-xs bg-slate-800 rounded-lg hover:bg-slate-700 disabled:opacity-30 transition">&raquo;</button>
      </div>
    </div>
