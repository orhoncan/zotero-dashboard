    <!-- Not Connected -->
    <div x-show="!connected && !loading" class="flex items-center justify-center h-full" x-cloak>
      <div class="text-center card p-8 max-w-md">
        <svg class="w-16 h-16 text-red-500/50 mx-auto mb-4" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z"/></svg>
        <h2 class="text-lg font-semibold mb-2" x-text="aiLanguage === 'en' ? 'Could Not Connect to Zotero' : 'Zotero\'ya Bağlanılamadı'"></h2>
        <p class="text-slate-400 text-sm mb-4" x-show="aiLanguage === 'en'" x-cloak>
          Zotero Desktop must be open. Start with
          <code class="text-xs bg-slate-700 px-1.5 py-0.5 rounded">npm start</code>
          (or <code class="text-xs bg-slate-700 px-1.5 py-0.5 rounded">node server.mjs</code>).
        </p>
        <p class="text-slate-400 text-sm mb-4" x-show="aiLanguage !== 'en'" x-cloak>
          Zotero Desktop açık olmalı.
          <code class="text-xs bg-slate-700 px-1.5 py-0.5 rounded">npm start</code>
          (veya <code class="text-xs bg-slate-700 px-1.5 py-0.5 rounded">node server.mjs</code>)
          ile başlatın.
        </p>
        <div x-show="connectionError" class="text-left text-[11px] text-red-300 bg-red-500/10 border border-red-500/30 rounded-md px-2.5 py-2 mb-4">
          <div class="font-semibold mb-1" x-text="aiLanguage === 'en' ? 'Connection detail' : 'Bağlantı detayı'"></div>
          <code class="break-words whitespace-pre-wrap" x-text="connectionError"></code>
        </div>
        <button @click="init()" class="accent-bg text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-red-700 transition" x-text="aiLanguage === 'en' ? 'Retry' : 'Tekrar Dene'"></button>
      </div>
    </div>
