	            <div class="grid grid-cols-2 gap-1.5">
              <button @click="sendClaude('summarize')" :disabled="chatLoading"

                x-text="quickPromptButtonLabel('notes')"></button>
              <button @click="sendClaude('related')" :disabled="chatLoading"

                <button
                  @click="sendClaude('summarize')"

              <button

                  <path d="M5 12h12"/>
                  <path d="m13 6 6 6-6 6"/>
                </svg>
                <svg x-show="chatLoading" class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24">

          <div class="border-t border-slate-700/50 shrink-0">

                  <svg class="w-3.5 h-3.5 text-violet-300" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/>
                  </svg>
                </button>
              </div>
              <div class="flex items-center justify-end mt-1.5 gap-2 flex-wrap">

                  <span x-text="savingNoteToObsidian ? (aiLanguage === 'en' ? 'Syncing...' : 'Senkronize ediliyor...') : (aiLanguage === 'en' ? 'Sync to Obsidian' : 'Obsidian’a Senkronize Et')"></span>
