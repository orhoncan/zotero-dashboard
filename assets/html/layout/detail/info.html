        <div x-show="detailTab==='info'" class="flex-1 overflow-y-auto p-4 fade-in">
          <button
            @click="persistChatForCurrentItem(); selectedItem=null"
            class="float-right text-slate-500 hover:text-white transition p-1"
            :title="aiLanguage === 'en' ? 'Close details' : 'Detay panelini kapat'">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12"/></svg>
          </button>
          <div class="inline-flex items-center gap-1.5 text-xs font-medium px-2 py-1 rounded-md mb-3" :class="getTypeColor(selectedItem.data.itemType)">
            <span class="inline-flex items-center justify-center" x-html="getTypeIcon(selectedItem.data.itemType)"></span>
            <span x-text="formatItemType(selectedItem.data.itemType)"></span>
          </div>
          <h2 class="text-base font-semibold leading-snug mb-3" x-text="selectedItem.data.title || (aiLanguage === 'en' ? 'Untitled' : 'Başlıksız')"></h2>

          <div class="mb-3" x-show="selectedItem.data.creators?.length">
            <h4 class="text-xs text-slate-500 uppercase tracking-wider mb-1" x-text="aiLanguage === 'en' ? 'Authors' : 'Yazarlar'"></h4>
            <p class="text-sm text-slate-300" x-text="formatAuthors(selectedItem.data.creators)"></p>
          </div>

          <div class="grid grid-cols-2 gap-2 mb-3">
            <template x-for="field in detailFields" :key="field.key">
              <div x-show="selectedItem.data[field.key]" class="bg-slate-800/50 rounded-lg p-2">
                <div class="text-[10px] text-slate-500 uppercase" x-text="field.label"></div>
                <div class="text-xs text-slate-200 truncate" x-text="selectedItem.data[field.key]"></div>
              </div>
            </template>
          </div>

          <!-- DOI / URL -->
          <div x-show="selectedItem.data.DOI" class="mb-2">
            <a :href="'https://doi.org/' + selectedItem.data.DOI" target="_blank" class="text-xs text-red-400 hover:text-red-300 flex items-center gap-1">
              <svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101"/><path d="M10.172 13.828a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/></svg>
              <span x-text="selectedItem.data.DOI"></span>
            </a>
          </div>

          <!-- Quick Actions -->
          <div class="flex gap-2 mb-3">
            <button
              @click="copyCitation()"
              class="flex-1 text-xs bg-slate-800 hover:bg-slate-700 border border-slate-600 rounded-lg px-2 py-1.5 transition text-center"
              x-text="aiLanguage === 'en' ? 'Copy APA' : 'APA Kopyala'"></button>
            <a x-show="selectedItem.data.url || selectedItem.data.DOI" :href="selectedItem.data.url || ('https://doi.org/' + selectedItem.data.DOI)" target="_blank"
              class="flex-1 text-xs bg-slate-800 hover:bg-slate-700 border border-slate-600 rounded-lg px-2 py-1.5 transition text-center no-underline text-slate-200"
              x-text="aiLanguage === 'en' ? 'Open Link' : 'Kaynağa Git'"></a>
          </div>

          <!-- Abstract -->
          <div class="mb-3">
            <h4 class="text-xs text-slate-500 uppercase tracking-wider mb-1" x-text="aiLanguage === 'en' ? 'Abstract' : 'Özet'"></h4>
            <template x-if="selectedItem.data.abstractNote">
              <p
                class="text-xs text-slate-300 leading-relaxed max-h-40 overflow-y-auto whitespace-pre-wrap"
                x-text="selectedItem.data.abstractNote"></p>
            </template>
            <template x-if="!selectedItem.data.abstractNote">
              <div class="abstract-empty-box rounded-md border px-2.5 py-2">
                <p class="text-xs text-slate-400" x-text="aiLanguage === 'en' ? 'No abstract yet.' : 'Henüz özet yok.'"></p>
                <button
                  @click="detailTab='chat'; sendClaude('summarize')"
                  :disabled="chatLoading"
                  class="mt-2 text-[11px] px-2.5 py-1.5 rounded-md border border-slate-600 bg-slate-800 hover:bg-slate-700 disabled:opacity-40 transition"
                  x-text="aiLanguage === 'en' ? 'Generate with AI' : 'AI ile özet oluştur'"></button>
              </div>
            </template>
          </div>

          <!-- Tags -->
          <div x-show="selectedItem.data.tags?.length" class="mb-3">
            <h4 class="text-xs text-slate-500 uppercase tracking-wider mb-1" x-text="aiLanguage === 'en' ? 'Tags' : 'Etiketler'"></h4>
            <div class="space-y-2">
              <div class="flex flex-wrap gap-1">
                <template x-for="tag in topicTags(selectedItem.data.tags)" :key="'topic-' + tag.tag">
                  <button @click="toggleTag(tag.tag); activeView='items'" class="tag-pill" :class="selectedTag===tag.tag?'active':''" x-text="tag.tag"></button>
                </template>
              </div>
              <div x-show="systemTags(selectedItem.data.tags).length">
                <div class="text-[10px] text-slate-500 uppercase tracking-wide" x-text="aiLanguage === 'en' ? 'System Tags' : 'Sistem Etiketleri'"></div>
                <div class="mt-1 flex flex-wrap gap-1">
                  <template x-for="tag in systemTags(selectedItem.data.tags)" :key="'sys-' + tag.tag">
                    <button @click="toggleTag(tag.tag); activeView='items'" class="tag-pill tag-pill-system" :class="selectedTag===tag.tag?'active':''" x-text="tag.tag"></button>
                  </template>
                </div>
              </div>
            </div>
          </div>

          <!-- Metadata Editor -->
          <div class="mb-3 border border-slate-700/50 rounded-lg overflow-hidden">
            <button
              @click="metadataEditorOpen = !metadataEditorOpen"
              class="metadata-editor-header w-full flex items-center justify-between px-3 py-2 text-left transition">
              <span class="text-[10px] text-slate-500 uppercase tracking-wide" x-text="aiLanguage === 'en' ? 'Metadata Editor' : 'Metadata Editörü'"></span>
              <svg class="w-3.5 h-3.5 text-slate-400 transition-transform" :class="metadataEditorOpen ? 'rotate-180' : ''" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path d="m6 9 6 6 6-6"/>
              </svg>
            </button>
            <div x-show="metadataEditorOpen" x-transition class="p-3 space-y-2">
              <div>
                <label class="text-[10px] text-slate-500 uppercase tracking-wide" x-text="aiLanguage === 'en' ? 'Abstract' : 'Özet'"></label>
                <textarea
                  x-model="editAbstract"
                  :placeholder="aiLanguage === 'en' ? 'Edit abstract...' : 'Özeti düzenleyin...'"
                  class="mt-1 w-full h-24 bg-slate-800 border border-slate-600 rounded-md text-xs px-2 py-2 text-slate-200 focus:outline-none focus:border-red-500 placeholder-slate-500 resize-y"></textarea>
              </div>
              <div>
                <label class="text-[10px] text-slate-500 uppercase tracking-wide" x-text="aiLanguage === 'en' ? 'Tags' : 'Etiketler'"></label>
                <div class="mt-1 flex flex-wrap gap-1.5" x-show="editTags.length">
                  <template x-for="tag in editTags" :key="tag">
                    <span class="inline-flex items-center gap-1 text-[11px] bg-slate-700 text-slate-200 rounded-md px-2 py-0.5">
                      <span x-text="tag"></span>
                      <button @click="removeEditTag(tag)" class="text-slate-400 hover:text-red-300 leading-none">&times;</button>
                    </span>
                  </template>
                </div>
                <div class="mt-1.5 flex items-center gap-1.5">
                  <input
                    x-model="editTagInput"
                    @keydown.enter.prevent="addTagFromInput()"
                    @blur="addTagFromInput()"
                    :placeholder="aiLanguage === 'en' ? 'Add tag and press Enter' : 'Etiket ekleyip Enter\'a basın'"
                    class="flex-1 bg-slate-800 border border-slate-600 rounded-md text-xs px-2 py-1.5 text-slate-200 focus:outline-none focus:border-red-500 placeholder-slate-500">
                  <button
                    @click="addTagFromInput()"
                    class="text-[10px] px-2 py-1.5 rounded-md border border-slate-600 bg-slate-800 hover:bg-slate-700 transition"
                    x-text="aiLanguage === 'en' ? 'Add' : 'Ekle'"></button>
                </div>
              </div>
              <div class="flex items-center justify-end gap-2 pt-1">
                <button
                  @click="syncMetadataEditorFromSelectedItem()"
                  :disabled="metadataSaving"
                  class="text-[10px] px-2 py-1 rounded-md border border-slate-600 bg-slate-800 hover:bg-slate-700 disabled:opacity-40 transition"
                  x-text="aiLanguage === 'en' ? 'Reset' : 'Sıfırla'"></button>
                <button
                  @click="saveItemMetadataToZotero()"
                  :disabled="metadataSaving"
                  class="text-[10px] px-2.5 py-1 rounded-md border border-red-700 accent-bg hover:bg-red-700 text-white disabled:opacity-40 transition">
                  <span x-text="metadataSaving ? (aiLanguage === 'en' ? 'Saving...' : 'Kaydediliyor...') : (aiLanguage === 'en' ? 'Save to Zotero' : 'Zotero\'ya Kaydet')"></span>
                </button>
              </div>
            </div>
          </div>

          <!-- Notes -->
          <div x-show="itemNotes.length" class="mb-3">
            <h4 class="text-xs text-slate-500 uppercase tracking-wider mb-1">
              <span x-text="aiLanguage === 'en' ? 'Notes' : 'Notlar'"></span>
              (<span x-text="itemNotes.length"></span>)
            </h4>
            <template x-for="note in itemNotes" :key="note.key">
              <div class="bg-slate-800/50 rounded-lg p-2 mb-1.5 text-xs text-slate-300 leading-relaxed max-h-32 overflow-y-auto" x-html="note.data.note"></div>
            </template>
          </div>

          <!-- Annotations -->
          <div x-show="itemAnnotations.length" class="mb-3">
            <h4 class="text-xs text-slate-500 uppercase tracking-wider mb-1">
              <span x-text="aiLanguage === 'en' ? 'Annotations' : 'Anotasyonlar'"></span>
              (<span x-text="itemAnnotations.length"></span>)
            </h4>
            <template x-for="ann in itemAnnotations" :key="ann.key">
              <div class="bg-slate-800/50 border border-slate-700 rounded-lg p-2 mb-1.5">
                <div class="flex items-center justify-between gap-2 mb-1">
                  <span class="text-[10px] text-slate-500" x-text="(aiLanguage === 'en' ? 'Page ' : 'Sayfa ') + ann.pageLabel"></span>
                  <span class="w-2 h-2 rounded-full" :style="'background:' + (ann.color || '#CC2936')"></span>
                </div>
                <p class="text-xs text-slate-200 leading-relaxed" x-text="ann.text || (aiLanguage === 'en' ? 'No selected text' : 'Seçim metni yok')"></p>
                <p x-show="ann.comment" class="text-[11px] text-slate-400 mt-1 leading-relaxed" x-text="ann.comment"></p>
              </div>
            </template>
          </div>
        </div>
