  <aside class="sidebar min-h-0 border-r border-slate-700/50 flex flex-col overflow-hidden" :class="sidebarCollapsed ? 'collapsed' : ''">
    <div class="flex-1 overflow-y-auto p-3">
      <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2 px-2" x-text="aiLanguage === 'en' ? 'Collections' : 'Koleksiyonlar'"></h3>
      <!-- All Items -->
      <button @click="selectCollection(null)" :class="!selectedCollection ? 'bg-slate-700/60 text-white' : 'text-slate-300 hover:bg-slate-800'"
        class="w-full text-left px-3 py-2 rounded-lg text-sm flex items-center gap-2 transition mb-0.5">
        <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/></svg>
        <span x-text="aiLanguage === 'en' ? 'All Items' : 'Tüm Öğeler'"></span>
        <span class="ml-auto text-xs text-slate-500" x-text="totalItems"></span>
      </button>
      <!-- Collection Tree (collapsible) -->
      <template x-for="col in collectionTree" :key="col.key">
        <div>
          <div class="flex items-center mb-0.5">
            <!-- Chevron toggle (only if has children) -->
            <button x-show="col.children.length > 0" @click.stop="toggleCollapse(col.key)"
              class="w-5 h-5 flex items-center justify-center text-slate-500 hover:text-slate-300 shrink-0">
              <svg class="w-3 h-3 chevron" :class="expandedCollections.includes(col.key) ? 'open' : ''" fill="currentColor" viewBox="0 0 20 20"><path d="M6 4l8 6-8 6V4z"/></svg>
            </button>
            <div x-show="col.children.length === 0" class="w-5 shrink-0"></div>
            <button @click="selectCollection(col.key)" :class="selectedCollection===col.key ? 'bg-slate-700/60 text-white' : 'text-slate-300 hover:bg-slate-800'"
              class="flex-1 text-left px-2 py-1.5 rounded-lg text-sm flex items-center gap-2 transition">
              <svg class="w-4 h-4 shrink-0" :class="selectedCollection===col.key ? 'text-red-400' : 'text-slate-500'" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/></svg>
              <span class="truncate" x-text="col.name"></span>
              <span class="ml-auto text-xs text-slate-500 shrink-0" x-text="col.numItems || ''"></span>
            </button>
          </div>
          <!-- Children (collapsible) -->
          <div x-show="expandedCollections.includes(col.key)" x-transition.duration.150ms>
            <template x-for="child in col.children" :key="child.key">
              <button @click="selectCollection(child.key)" :class="selectedCollection===child.key ? 'bg-slate-700/60 text-white' : 'text-slate-300 hover:bg-slate-800'"
                class="w-full text-left pl-10 pr-3 py-1.5 rounded-lg text-xs flex items-center gap-2 transition mb-0.5">
                <svg class="w-3.5 h-3.5 shrink-0 text-slate-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/></svg>
                <span class="truncate" x-text="child.name"></span>
                <span class="ml-auto text-xs text-slate-500 shrink-0" x-text="child.numItems || ''"></span>
              </button>
            </template>
          </div>
        </div>
      </template>
    </div>
    <!-- Tag Cloud -->
    <div class="border-t border-slate-700/50 p-3 max-h-[30vh] overflow-y-auto">
      <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2 px-2" x-text="aiLanguage === 'en' ? 'Tags' : 'Etiketler'"></h3>
      <div class="flex flex-wrap gap-1.5 px-1">
        <template x-for="tag in topTags" :key="tag.tag">
          <button @click="toggleTag(tag.tag)" class="tag-pill transition" :class="selectedTag===tag.tag ? 'active' : ''"
            x-text="tag.tag + ' (' + tag.count + ')'"></button>
        </template>
      </div>
      <button x-show="allTags.length > 40" @click="showAllTags = !showAllTags" class="text-xs text-red-400 mt-2 px-2 hover:underline">
        <span x-text="showAllTags ? (aiLanguage === 'en' ? 'Show less' : 'Daha az göster') : ((allTags.length - 40) + (aiLanguage === 'en' ? ' more tags...' : ' etiket daha...'))"></span>
      </button>
    </div>
  </aside>
