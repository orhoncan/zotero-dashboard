<header class="header-shell z-30 border-b border-slate-700/50 bg-slate-900 px-4 py-2.5">
  <div class="flex items-center gap-2.5">
    <div class="flex items-center gap-2 shrink-0">
      <button
        @click="sidebarCollapsed = !sidebarCollapsed"
        class="w-8 h-8 rounded-lg border border-slate-600 bg-slate-800 hover:bg-slate-700 transition flex items-center justify-center"
        :title="sidebarCollapsed ? (aiLanguage === 'en' ? 'Open left panel' : 'Sol paneli aç') : (aiLanguage === 'en' ? 'Collapse left panel' : 'Sol paneli daralt')">
        <svg class="w-4 h-4 text-slate-300 transition-transform" :class="sidebarCollapsed ? 'rotate-180' : ''" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M15 6l-6 6 6 6"/>
        </svg>
      </button>
      <svg class="w-7 h-7" viewBox="0 0 32 32" fill="none"><rect width="32" height="32" rx="8" fill="#CC2936"/><text x="16" y="22" text-anchor="middle" fill="white" font-size="16" font-weight="700">Z</text></svg>
      <div class="leading-tight hidden sm:block">
        <span class="font-semibold text-sm tracking-tight" x-text="aiLanguage === 'en' ? 'Orhon\u0027s Zotero Dashboard' : 'Orhon\u0027un Zotero Paneli'"></span>
      </div>
    </div>

    <div class="flex-1 max-w-2xl relative">
      <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input
        x-ref="searchInput"
        type="text"
        x-model="searchQuery"
        @keydown.enter="search()"
        @input.debounce.500ms="search()"
        :placeholder="aiLanguage === 'en' ? 'Search (within selected collection) — Cmd+K' : 'Global ara (koleksiyon seçiliyken sadece o koleksiyonda) — Cmd+K'"
        class="w-full bg-slate-800 border border-slate-600 rounded-lg pl-10 pr-4 py-2 text-sm focus:outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500/30 transition placeholder-slate-500">
    </div>

    <div class="hidden md:flex items-center gap-1 bg-slate-800 rounded-lg p-0.5 shrink-0">
      <button @click="activeView='items'" :class="activeView==='items' ? 'bg-slate-700 text-white' : 'text-slate-400 hover:text-slate-200'" class="px-2.5 py-1.5 text-xs font-medium rounded-md transition" x-text="aiLanguage === 'en' ? 'List' : 'Liste'"></button>
      <button @click="activeView='recent'" :class="activeView==='recent' ? 'bg-slate-700 text-white' : 'text-slate-400 hover:text-slate-200'" class="px-2.5 py-1.5 text-xs font-medium rounded-md transition" x-text="aiLanguage === 'en' ? 'Recent' : 'Son Eklenen'"></button>
    </div>

    <div class="hidden md:flex items-center gap-0.5 bg-slate-800 rounded-lg p-0.5 shrink-0">
      <button
        @click="setListDensity('compact')"
        :class="listDensity === 'compact' ? 'bg-slate-700 text-slate-100' : 'text-slate-400 hover:text-slate-200'"
        class="w-8 h-7 rounded-md flex items-center justify-center transition"
        :title="aiLanguage === 'en' ? 'Compact list' : 'Yoğun liste'">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M5 7h14M5 12h14M5 17h14"/>
        </svg>
      </button>
      <button
        @click="setListDensity('comfortable')"
        :class="listDensity === 'comfortable' ? 'bg-slate-700 text-slate-100' : 'text-slate-400 hover:text-slate-200'"
        class="w-8 h-7 rounded-md flex items-center justify-center transition"
        :title="aiLanguage === 'en' ? 'Comfortable list' : 'Rahat liste'">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M5 8h14M5 16h14"/>
        </svg>
      </button>
    </div>

    <div class="hidden lg:flex items-center gap-2 shrink-0 text-xs">
      <div class="status-dot" :class="connected ? 'bg-emerald-400' : 'bg-red-500'"></div>
      <span x-text="connected ? (aiLanguage === 'en' ? 'Connected' : 'Bağlı') : (aiLanguage === 'en' ? 'Disconnected' : 'Bağlantı yok')" :class="connected ? 'text-emerald-400' : 'text-red-400'"></span>
    </div>
    <div class="hidden xl:flex items-center gap-3 shrink-0 text-xs text-slate-400" :class="connected ? '' : 'opacity-45'">
      <span><strong class="text-slate-200" x-text="totalItems"></strong> <span x-text="aiLanguage === 'en' ? 'items' : 'öğe'"></span></span>
      <span><strong class="text-slate-200" x-text="collections.length"></strong> <span x-text="aiLanguage === 'en' ? 'collections' : 'koleksiyon'"></span></span>
    </div>

    <div class="ml-auto shrink-0 flex items-center gap-1">
      <button
        @click="if (selfCheckOpen) { selfCheckOpen = false; if (typeof clearSelfCheckAutoHideTimer === 'function') clearSelfCheckAutoHideTimer(); } else { selfCheckOpen = true; runStartupSelfCheck(true); }"
        class="w-8 h-8 rounded-lg border border-slate-600 bg-slate-800 hover:bg-slate-700 transition flex items-center justify-center text-slate-300"
        :title="aiLanguage === 'en' ? 'Startup self-check panel' : 'Açılış self-check paneli'">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M12 3l8 4v5c0 5-3 8-8 9-5-1-8-4-8-9V7l8-4z"/>
          <path d="m9 12 2 2 4-4"/>
        </svg>
      </button>

      <button
        @click="toggleTheme()"
        class="relative w-11 h-8 rounded-lg border transition"
        :class="theme === 'dark' ? 'bg-slate-800 border-slate-600 hover:bg-slate-700' : 'bg-amber-50 border-amber-300 hover:bg-amber-100'"
        :title="theme === 'dark' ? (aiLanguage === 'en' ? 'Switch to light theme' : 'Aydınlık temaya geç') : (aiLanguage === 'en' ? 'Switch to dark theme' : 'Koyu temaya geç')">
        <span class="absolute top-0.5 left-0.5 w-4 h-7 rounded-md flex items-center justify-center transition-transform duration-150"
          :class="theme === 'dark' ? 'translate-x-0 bg-slate-700 text-slate-200' : 'translate-x-6 bg-white text-amber-600'">
          <svg x-show="theme === 'dark'" class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M21 12.79A9 9 0 1111.21 3a7 7 0 009.79 9.79z"/>
          </svg>
          <svg x-show="theme !== 'dark'" class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2m0 16v2m10-10h-2M4 12H2"/>
          </svg>
        </span>
      </button>

      <button
        @click="toggleUiLanguage()"
        class="w-10 h-8 rounded-lg border border-slate-600 bg-slate-800 hover:bg-slate-700 transition text-[11px] font-semibold text-slate-200"
        :title="aiLanguage === 'en' ? 'Switch interface language' : 'Arayüz dilini değiştir'"
        x-text="aiLanguage === 'tr' ? 'TR' : 'EN'"></button>
    </div>
  </div>
</header>
