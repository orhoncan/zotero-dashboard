<script>
  (function applySavedLanguage() {
    try {
      const savedLanguage = localStorage.getItem('zotero-ui-language') || localStorage.getItem('zotero-ai-language');
      const isEn = savedLanguage === 'en';
      document.documentElement.lang = isEn ? 'en' : 'tr';
      document.title = isEn
        ? "Orhon's Zotero Dashboard"
        : "Orhon'un Zotero Paneli";
    } catch (e) {
      document.documentElement.lang = 'tr';
      document.title = "Orhon'un Zotero Paneli";
    }
  })();
</script>
<script>
  (function applySavedThemeEarly() {
    try {
      var savedTheme = localStorage.getItem('zotero-theme') || 'light';
      if (savedTheme === 'dark') {
        document.documentElement.classList.remove('theme-light');
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.add('theme-light');
        document.documentElement.classList.remove('dark');
      }
    } catch (e) {
      document.documentElement.classList.add('theme-light');
      document.documentElement.classList.remove('dark');
    }
  })();
</script>
